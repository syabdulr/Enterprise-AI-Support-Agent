name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Run Black formatter check
        run: |
          black --check src/ tests/ --line-length 100 || echo "⚠️ Black found formatting issues (non-blocking)"
          exit 0

      - name: Run isort import sort check
        run: |
          isort --check-only src/ tests/ || echo "⚠️ isort found import issues (non-blocking)"
          exit 0

      - name: Run Flake8 linter
        run: |
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || echo "⚠️ Flake8 found issues (non-blocking)"
          exit 0

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          pip install -r requirements-dev.txt

      - name: Run simple tests
        run: |
          pytest tests/test_simple.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: enterprise-ai-support-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max